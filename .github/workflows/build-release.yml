name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
        default: "manual"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7

      - name: Install Sourceknight
        run: |
          python -m pip install --upgrade pip
          pip install sourceknight

      - name: Get version from source
        id: get_version
        run: |
          VERSION=$(grep -oP '#define PLUGIN_VERSION "\K[^"]+' addons/sourcemod/scripting/sourcecord.sp)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION"

      - name: Compile plugin
        run: |
          sourceknight build

      - name: Create release package
        run: |
          mkdir -p release/addons/sourcemod/plugins
          mkdir -p release/addons/sourcemod/configs

          cp addons/sourcemod/configs/sourcecord.cfg release/addons/sourcemod/configs
          cp sourcecord.smx release/addons/sourcemod/plugins

      - name: Upload to release
        if: github.event_name == 'release'
        run: |
          gh release upload ${{ github.event.release.tag_name }} ./release/addons/sourcemod/plugins/sourcecord.smx
          gh release upload ${{ github.event.release.tag_name }} ./release/addons/sourcemod/configs/sourcecord.cfg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sourcecord-v${{ steps.get_version.outputs.version }}
          path: release/
          retention-days: 30
