project:
  name: sourcecord
  sourceknight: 0.4
  dependencies:
    - name: sourcemod
      type: tar
      version: 1.12.0-git7263
      location: https://github.com/alliedmodders/sourcemod/releases/download/1.12.0.7263/sourcemod-1.12.0-git7263-linux.tar.gz
      unpack:
      - source: /addons
        dest: /addons
    - name: ripext
      type: git
      repo: https://github.com/ErikMinekus/sm-ripext
      unpack:
        - source: /pawn/scripting
          dest: /addons/sourcemod/scripting
  root: /
  targets:
    - sourcecord
